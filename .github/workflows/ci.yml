name: CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall builds css-engine and the core-v2 CSS the tests compile against.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: css-engine tests
        run: pnpm --filter @nataliebasille/css-engine test

      - name: core-v2 tests
        run: pnpm --filter ./packages/core-v2 test

      - name: core-v2 type-check
        run: pnpm --filter ./packages/core-v2 type-check

  e2e:
    name: E2E tests (showcase-v2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter showcase-v2 exec playwright install --with-deps chromium

      # Builds showcase-v2 for production and serves it (see playwright.config.ts).
      - name: Run Playwright
        run: pnpm --filter showcase-v2 test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: showcase-v2/playwright-report
          retention-days: 7
