<!-- Interest invokers exercised by interest.e2e.spec.ts. Each case is a
     focusable "before" button, the invoker, and its hint popover. -->

<div class="flex flex-col items-start gap-2 p-4">
  <button id="longhand-bare-before">Before</button>
  <button
    id="longhand-bare"
    interestfor="longhand-bare-tip"
    class="interest-delay-start-1000 interest-delay-end-700"
  >
    Longhands, bare integers
  </button>

  <button id="longhand-arbitrary-before">Before</button>
  <button
    id="longhand-arbitrary"
    interestfor="longhand-arbitrary-tip"
    class="interest-delay-start-[1s] interest-delay-end-[0.7s]"
  >
    Longhands, arbitrary values
  </button>

  <button id="shorthand-bare-before">Before</button>
  <button
    id="shorthand-bare"
    interestfor="shorthand-bare-tip"
    class="interest-delay-1000"
  >
    Shorthand, bare integer
  </button>

  <button id="shorthand-arbitrary-before">Before</button>
  <button
    id="shorthand-arbitrary"
    interestfor="shorthand-arbitrary-tip"
    class="interest-delay-[1s_700ms]"
  >
    Shorthand, two arbitrary values
  </button>

  <button id="zero-before">Before</button>
  <button
    id="zero"
    interestfor="zero-tip"
    class="interest-delay-start-0 interest-delay-end-0"
  >
    Zero delays
  </button>

  <button id="shorthand-start-override-before">Before</button>
  <button
    id="shorthand-start-override"
    interestfor="shorthand-start-override-tip"
    class="interest-delay-1000 interest-delay-start-200"
  >
    Shorthand with a start override
  </button>

  <button id="shorthand-end-override-before">Before</button>
  <button
    id="shorthand-end-override"
    interestfor="shorthand-end-override-tip"
    class="interest-delay-1000 interest-delay-end-200"
  >
    Shorthand with an end override
  </button>

  <button id="shorthand-variant-override-before">Before</button>
  <button
    id="shorthand-variant-override"
    interestfor="shorthand-variant-override-tip"
    class="interest-delay-200 md:interest-delay-[1s_700ms]"
  >
    Bare shorthand overridden by an arbitrary one at md
  </button>

  <!-- Tab target after the last invoker, so focus never leaves the page. -->
  <button id="after">After</button>
</div>

<div id="longhand-bare-tip" popover="hint" class="tip">Tip</div>
<div id="longhand-arbitrary-tip" popover="hint" class="tip">Tip</div>
<div id="shorthand-bare-tip" popover="hint" class="tip">Tip</div>
<div id="shorthand-arbitrary-tip" popover="hint" class="tip">Tip</div>
<div id="zero-tip" popover="hint" class="tip">Tip</div>
<div id="shorthand-start-override-tip" popover="hint" class="tip">Tip</div>
<div id="shorthand-end-override-tip" popover="hint" class="tip">Tip</div>
<div id="shorthand-variant-override-tip" popover="hint" class="tip">Tip</div>

<style>
  /* Keep popovers away from the invokers so they never cover the pointer. */
  .tip {
    position: fixed;
    inset: auto 16px 16px auto;
    margin: 0;
  }
</style>
